name: Build Android APK (Fast)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Wuxuu kuu ogolaanayaa inaad gacanta ku bilowdo

# Qaybtan ayaa joojinaysa shaqooyinka hore haddii mid cusub la bilaabo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # Haddii uu 20 daqiiqo ka baxo, si toos ah ayuu u joogsanayaa

    steps:
    # 1. Soo dejinta koodhka
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Dejinta Java 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. Dejinta Gradle (Qaybtan ayaa xawaareyneysa soo dejinta faylasha)
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # 4. Fasaxa gradlew
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 5. Dhisidda APK-da
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 6. Kaydinta APK-da
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Send-Anything-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
