name: Build Android APK (Custom Name)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Wuxuu kuu ogolaanayaa inaad gacanta ku dhiso (Manual trigger)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Soo dejinta koodhka repository-ga
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Dejinta Java (JDK 17 waa loo baahan yahay Android casriga ah)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 3. Bixinta fasaxa (permission) si gradlew loo shaqaysiiyo
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. Dhisidda APK-da (Debug version)
    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # 5. Kaydinta APK-da si aad u soo dejiso
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Send-Anything-App-APK
        path: app/build/outputs/apk/debug/app-debug.apk
